<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zentropy Solutions | Coming soon</title>
    <meta
      name="description"
      content="Zentropy Solutions is being rebuilt. A new site is on the way. In the meantime, get in touch by email."
    >
    <meta property="og:title" content="Zentropy Solutions">
    <meta property="og:description" content="A new Zentropy is on the way.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zentropy.solutions/">
    <meta property="og:image" content="https://zentropy.solutions/assets/img/zentropy-social.png">
    <meta name="theme-color" content="#000000">
    <link rel="canonical" href="https://zentropy.solutions/">
    <link rel="icon" href="assets/icons/zentropy-favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/icons/zentropy-favicon.png">
    <style>
      :root {
        --black: #000000;
        --text: #ecedee;
        --text-soft: #c8d1d5;
        --muted: #8c989f;
        --cyan: #65eff6;
        --line: rgba(236, 237, 238, 0.16);
        --line-strong: rgba(101, 239, 246, 0.4);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        color: var(--text);
        background: var(--black);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 1fr auto;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
      }

      /* Drifting point mesh carried over from the old hero. */
      .stage-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* Fades the mesh out behind the logo and copy so they sit on clean black. */
      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
        background: radial-gradient(
          ellipse 72% 68% at 50% 46%,
          #000 0%,
          #000 48%,
          rgba(0, 0, 0, 0.72) 70%,
          rgba(0, 0, 0, 0.3) 100%
        );
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 20px 24px;
        text-align: center;
      }

      .logo {
        display: block;
        /* The image has wide black margins, so on phones it is allowed to run
           past the screen edges to keep the mark itself a readable size. */
        --logo-width: min(135vw, 680px);
        width: var(--logo-width);
        max-width: none;
        height: auto;
        margin-inline: calc((100% - var(--logo-width)) / 2);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: clamp(20px, 4vh, 40px) 0 0;
        color: var(--cyan);
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 12px rgba(101, 239, 246, 0.8);
        animation: pulse 2.4s ease-in-out infinite;
      }

      h1 {
        max-width: 16ch;
        margin: 18px 0 0;
        font-size: clamp(2rem, 6vw, 3.4rem);
        font-weight: 650;
        line-height: 1.08;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      .lede {
        max-width: 44ch;
        margin: 18px 0 0;
        color: var(--text-soft);
        font-size: clamp(1rem, 2.4vw, 1.12rem);
        text-wrap: pretty;
      }

      .contact {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        margin-top: 30px;
        padding: 0 24px;
        color: var(--text);
        font-size: 0.98rem;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: rgba(101, 239, 246, 0.06);
        transition:
          background 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .contact:hover,
      .contact:focus-visible {
        border-color: var(--cyan);
        background: rgba(101, 239, 246, 0.14);
        box-shadow: 0 0 32px rgba(101, 239, 246, 0.18);
      }

      .contact:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }

      footer {
        position: relative;
        z-index: 2;
        padding: 20px;
        color: var(--muted);
        font-size: 0.82rem;
        text-align: center;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .eyebrow::before {
          animation: none;
        }

        .contact {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas class="stage-canvas" id="stage-canvas" aria-hidden="true"></canvas>

      <main class="content">
        <img
          class="logo"
          src="assets/logos/zentropy-logo.webp"
          width="1800"
          height="550"
          alt="Zentropy Solutions"
        >
        <p class="eyebrow">Coming soon</p>
        <h1>A new Zentropy is on the way.</h1>
        <p class="lede">
          The site is offline while we rework what we do and how we do it. Until it is back,
          email is the best way to reach us.
        </p>
        <a class="contact" href="mailto:info@zentropy.solutions">info@zentropy.solutions</a>
      </main>

      <footer>&copy; <span data-year>2026</span> Zentropy Solutions</footer>
    </div>

    <script>
      (function () {
        var yearTarget = document.querySelector("[data-year]");
        if (yearTarget) {
          yearTarget.textContent = new Date().getFullYear();
        }

        var canvas = document.getElementById("stage-canvas");
        var context = canvas && canvas.getContext ? canvas.getContext("2d") : null;
        if (!context) {
          return;
        }

        var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        var palette = ["#65eff6", "#2fa9bc", "#9da2a6", "#ecedee"];
        var linkDistance = 138;
        var width = 0;
        var height = 0;
        var points = [];
        var frame = 0;
        var animationId = 0;

        function resize() {
          var rect = canvas.getBoundingClientRect();
          var pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          width = Math.max(1, Math.floor(rect.width));
          height = Math.max(1, Math.floor(rect.height));
          canvas.width = Math.floor(width * pixelRatio);
          canvas.height = Math.floor(height * pixelRatio);
          context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

          var spacing = width < 700 ? 86 : 112;
          var columns = Math.ceil(width / spacing) + 2;
          var rows = Math.ceil(height / spacing) + 2;
          points = [];

          for (var row = -1; row < rows; row += 1) {
            for (var column = -1; column < columns; column += 1) {
              var seed = row * 97 + column * 53;
              points.push({
                baseX: column * spacing + ((seed * 17) % 31),
                baseY: row * spacing + ((seed * 23) % 37),
                x: 0,
                y: 0,
                phase: seed,
                color: palette[Math.abs(seed) % palette.length],
              });
            }
          }
        }

        function draw() {
          var time = frame * 0.006;
          var i;
          var j;

          context.clearRect(0, 0, width, height);

          for (i = 0; i < points.length; i += 1) {
            points[i].x = points[i].baseX + Math.sin(time + points[i].phase) * 12;
            points[i].y = points[i].baseY + Math.cos(time * 0.8 + points[i].phase) * 10;
          }

          context.lineWidth = 1;

          for (i = 0; i < points.length; i += 1) {
            for (j = i + 1; j < points.length; j += 1) {
              var distance = Math.hypot(points[i].x - points[j].x, points[i].y - points[j].y);

              if (distance < linkDistance) {
                var alpha = (1 - distance / linkDistance) * 0.2;
                context.strokeStyle = "rgba(101, 239, 246, " + alpha + ")";
                context.beginPath();
                context.moveTo(points[i].x, points[i].y);
                context.lineTo(points[j].x, points[j].y);
                context.stroke();
              }
            }
          }

          context.globalAlpha = 0.72;
          for (i = 0; i < points.length; i += 1) {
            context.fillStyle = points[i].color;
            context.beginPath();
            context.arc(points[i].x, points[i].y, 3.2, 0, Math.PI * 2);
            context.fill();
          }
          context.globalAlpha = 1;

          frame += 1;

          if (!reducedMotion.matches) {
            animationId = window.requestAnimationFrame(draw);
          }
        }

        function restart() {
          window.cancelAnimationFrame(animationId);
          resize();
          draw();
        }

        restart();
        window.addEventListener("resize", restart);
        if (reducedMotion.addEventListener) {
          reducedMotion.addEventListener("change", restart);
        }
      })();
    </script>
  </body>
</html>
